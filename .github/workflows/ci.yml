name: CI

on:
  pull_request:
  push:
    branches: [main]

# テストは公開依存と一時DBだけで動く。書き込み権限や独自のSecretは渡さない。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          cache: npm
      # better-sqlite3のネイティブ依存も含め、lockfileどおりに新規導入する。
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
