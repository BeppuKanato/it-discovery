services:
  api:
    image: ${API_IMAGE:-it-discovery-api:local}
    build:
      context: .
      dockerfile: Dockerfile
    # 公開前のローカル確認用。外部へ直接公開せず、外部のHTTPS受付はCaddyで行う。
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_PATH: /data/it-discovery.db
      AUTH_MODE: google
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_ALLOWED_SUBS: ${GOOGLE_ALLOWED_SUBS:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - data:/data
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  data:
