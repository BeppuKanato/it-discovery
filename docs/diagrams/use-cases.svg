xtLength="64" font-family="Meiryo">解除する</text></g><!--entity Register--><g class="entity" data-qualified-name="IT..................Register" id="ent0011" data-source-line="28"><ellipse cx="218.952" cy="689.625" rx="104.952" ry="33.586" fill="#F4F8F6" style="stroke:#47665C;stroke-width:0.5;"/><text x="138.952" y="691.165" fill="#000" font-size="16" textLength="160" font-family="Meiryo">記事を「気になる」に</text><text x="186.952" y="715.165" fill="#000" font-size="16" textLength="64" font-family="Meiryo">登録する</text></g><!--entity Open--><g class="entity" data-qualified-name="IT..................Open" id="ent0012" data-source-line="29"><ellipse cx="218.882" cy="767.51" rx="70.882" ry="19.971" fill="#F4F8F6" style="stroke:#47665C;stroke-width:0.5;"/><text x="170.882" y="776.01" fill="#000" font-size="16" textLength="96" font-family="Meiryo">元記事を開く</text></g><!--entity User--><g class="entity" data-qualified-name="User" id="ent0001" data-source-line="16"><ellipse cx="30" cy="412.039" rx="8" ry="8" fill="#F1F1F1" style="stroke:#253D35;stroke-width:0.5;"/><path d="M30,420.039 L30,447.039 M17,428.039 L43,428.039 M30,447.039 L17,462.039 M30,447.039 L43,462.039" style="stroke:#253D35;stroke-width:0.5;" fill="none"/><text x="6" y="480.5" fill="#000" font-size="16" textLength="48" font-family="Meiryo">利用者</text></g><g class="entity" data-qualified-name="GMN20" id="ent0021" data-source-line="41"><path d="M449,82.539 L449,119.539 L301.17,123.539 L449,127.539 L449,164.539 A0,0 0 0 0 449,164.539 L678,164.539 A0,0 0 0 0 678,164.539 L678,92.539 L668,82.539 L449,82.539 A0,0 0 0 0 449,82.539" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M668,82.539 L668,92.539 L678,92.539 L668,82.539" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="455" y="104.5" fill="#000" font-size="16" textLength="192" font-family="Meiryo">カードを一件ずつ確認し、</text><text x="455" y="128.5" fill="#000" font-size="16" textLength="208" font-family="Meiryo">「気になる」に登録するか、</text><text x="455" y="152