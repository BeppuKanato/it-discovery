<text x="215" y="182" text-anchor="middle" font-size="23" font-weight="700">
<tspan x="215">VueとNestで</tspan><tspan x="215" dy="34">IT情報を集める</tspan>
</text>
<text x="215" y="251" text-anchor="middle" font-size="12" fill="#657777">
<tspan x="215">記事の収集と仕分けの仕組みを、</tspan><tspan x="215" dy="21">役割ごとに分けて考える。</tspan>
</text>
<rect x="282" y="295" width="22" height="22" rx="6" fill="#3ea8ff"/>
