<svg xmlns="http://www.w3.org/2000/svg" width="430" height="650" viewBox="0 0 430 650" role="img" aria-labelledby="title desc">
<title id="title">仕分けカード：タイトルと説明をサムネイル領域内に配置する</title>
<desc id="desc">日本語のスマホ画面。カード中央にタイトルと短い説明、右下に出典、カード下部に日付、下に見送り・元記事・気になる操作を配置する。</desc>
<defs><linearGradient id="frame" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#62caff"/><stop offset="1" stop-color="#a493f5"/></linearGradient></defs>
<rect width="430" height="650" rx="28" fill="#f7f9f7"/>
<g font-family="'Noto Sans JP','Yu Gothic',sans-serif" fill="#183431">
<text x="28" y="48" font-size="29" font-weight="700" fill="#087f72">sift</text>
<rect x="282" y="23" width="66" height="32" rx="16" fill="#e3f3ee"/>
<text x="315" y="44" text-anchor="middle" font-size="12" fill="#087f72">↶ 戻す</text>
<text x="376" y="44" text-anchor="middle" font-size="12" fill="#657777">01 / 10</text>
<text x="28" y="87" font-size="19" font-weight="700">ひとつずつ、気になるを。</text>
<rect x="24" y="119" width="382" height="330" rx="24" fill="#dcece6"/>
<rect x="20" y="111" width="390" height="330" rx="24" fill="#fff" stroke="#dee7e2"/>
